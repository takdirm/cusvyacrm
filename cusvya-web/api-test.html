<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Connection Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 50px auto;
        padding: 20px;
      }
      .test-result {
        margin: 20px 0;
        padding: 15px;
        border-radius: 5px;
      }
      .success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
      .info {
        background-color: #d1ecf1;
        border: 1px solid #bee5eb;
        color: #0c5460;
      }
      pre {
        background: #f4f4f4;
        padding: 10px;
        border-radius: 3px;
        overflow-x: auto;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>API Connection Test for https://api.scootr.in</h1>

    <div>
      <button onclick="testDirectFetch()">Test Direct Fetch (No Auth)</button>
      <button onclick="testWithAuth()">Test With Auth Token</button>
      <button onclick="testAxios()">Test Via Axios</button>
    </div>

    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const API_BASE = 'https://api.scootr.in/api';
      const CUSTOMER_ENDPOINT = '/Customer/paged?page=1&pageSize=10';

      function log(message, type = 'info') {
        const resultsDiv = document.getElementById('results');
        const div = document.createElement('div');
        div.className = `test-result ${type}`;
        div.innerHTML = message;
        resultsDiv.appendChild(div);
      }

      function clearResults() {
        document.getElementById('results').innerHTML = '';
      }

      async function testDirectFetch() {
        clearResults();
        log('Testing with Direct Fetch API (no auth)...', 'info');

        const startTime = performance.now();

        try {
          const response = await fetch(API_BASE + CUSTOMER_ENDPOINT, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
            },
          });

          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);

          if (response.ok) {
            const data = await response.json();
            log(
              `✅ Success! (${duration}ms)<br>Status: ${response.status}<br>Data received: ${JSON.stringify(data).substring(0, 200)}...`,
              'success',
            );
          } else {
            log(`⚠️ Response received but not OK<br>Status: ${response.status}<br>Duration: ${duration}ms`, 'error');
          }
        } catch (error) {
          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);
          log(`❌ Error (${duration}ms)<br>${error.message}<br><pre>${error.stack}</pre>`, 'error');
        }
      }

      async function testWithAuth() {
        clearResults();
        const token = localStorage.getItem('authToken') || prompt('Enter auth token (or cancel for no auth):');

        if (!token) {
          log('No token provided, testing without auth...', 'info');
        } else {
          log('Testing with Authorization header...', 'info');
        }

        const startTime = performance.now();

        try {
          const headers = {
            'Content-Type': 'application/json',
          };

          if (token) {
            headers['Authorization'] = `Bearer ${token}`;
          }

          const response = await fetch(API_BASE + CUSTOMER_ENDPOINT, {
            method: 'GET',
            headers: headers,
          });

          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);

          if (response.ok) {
            const data = await response.json();
            log(
              `✅ Success! (${duration}ms)<br>Status: ${response.status}<br>Items: ${data.items?.length || 0}<br>Total: ${data.totalCount || 0}`,
              'success',
            );
            log(`<pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>`, 'info');
          } else {
            const text = await response.text();
            log(
              `⚠️ Response received but not OK<br>Status: ${response.status}<br>Duration: ${duration}ms<br>Response: ${text}`,
              'error',
            );
          }
        } catch (error) {
          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);
          log(`❌ Error (${duration}ms)<br>${error.message}`, 'error');
        }
      }

      async function testAxios() {
        clearResults();
        log('Testing with Axios library...', 'info');

        const startTime = performance.now();

        try {
          const token = localStorage.getItem('authToken');
          const config = {
            method: 'GET',
            url: API_BASE + CUSTOMER_ENDPOINT,
            headers: {
              'Content-Type': 'application/json',
            },
            timeout: 30000,
          };

          if (token) {
            config.headers['Authorization'] = `Bearer ${token}`;
          }

          const response = await axios(config);

          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);

          log(
            `✅ Axios Success! (${duration}ms)<br>Status: ${response.status}<br>Items: ${response.data.items?.length || 0}`,
            'success',
          );
          log(`<pre>${JSON.stringify(response.data, null, 2).substring(0, 500)}...</pre>`, 'info');
        } catch (error) {
          const endTime = performance.now();
          const duration = (endTime - startTime).toFixed(2);

          if (error.response) {
            log(
              `❌ Axios Error - Response received (${duration}ms)<br>Status: ${error.response.status}<br>Message: ${error.message}`,
              'error',
            );
          } else if (error.request) {
            log(
              `❌ Axios Error - No response (${duration}ms)<br>Request was sent but no response received<br>This usually indicates a CORS or network issue`,
              'error',
            );
          } else {
            log(`❌ Axios Error - Setup (${duration}ms)<br>${error.message}`, 'error');
          }
        }
      }

      // Auto-run first test on load
      window.addEventListener('load', () => {
        setTimeout(testDirectFetch, 500);
      });
    </script>
  </body>
</html>
